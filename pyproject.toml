[project]
name = "whisper-asr-webservice"
version = "2.1.0-dev"
description = "Whisper ASR Webservice is a general-purpose speech recognition webservice."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.165.0)",
    "uvicorn[standard] (>=0.54.0)",
    "python-multipart (>=0.0.34)",
    "av (>=19.0.2)",
    "numpy (>=2.2.6)",
    "openai-whisper (>=20250625)",
    "faster-whisper (>=1.2.1)",
    "whisperx (>=3.8.6)",
    "tqdm (>=4.70.1)",
    "llvmlite (>=0.50.0)",
    "numba (>=0.68.1)",
    # pyannote-audio (whisperx diarization) requires torchcodec, but torchcodec 0.7 (the release matching
    # torch 2.8) ships no linux/aarch64 wheels. The service always hands pyannote in-memory waveforms, so
    # torchcodec's decoders are never used; on linux/aarch64 any installable release is sufficient.
    "torchcodec (>=0.7.0,<0.8.0) ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchcodec (>=0.11.0) ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers (>=4.56.0)",
    # mistral-common is for the voxtral engine. 1.10+ downloads the tokenizer through huggingface-hub >= 1.0,
    # which transformers pins below, so the tokenizer download breaks at runtime; 1.9.x uses a compatible version.
    "mistral-common[audio,hf-hub] (>=1.8.1,<1.10)",
]
authors = [
    { name = "Ahmet Öner" },
    { name = "Besim Alibegovic" }
]
license = "MIT"
license-files = ["LICENCE"]
readme = "README.md"
keywords = ["speech-recognition", "whisper", "asr", "webservice"]

[project.urls]
Homepage = "https://github.com/ahmetoner/whisper-asr-webservice/"
Repository = "https://github.com/ahmetoner/whisper-asr-webservice"

[project.scripts]
whisper-asr-webservice = "app.webservice:start"

[dependency-groups]
cpu = [
    "torch (==2.8.0)",
    "torchaudio (==2.8.0)",
    "torchvision (==0.23.0)",
]
cuda = [
    "torch (==2.8.0) ; sys_platform == 'linux'",
    "torchaudio (==2.8.0) ; sys_platform == 'linux'",
    "torchvision (==0.23.0) ; sys_platform == 'linux'",
    "triton (==3.4.0) ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)",
    "ruff (>=0.17.6,<1.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mkdocs-material (>=9.8.2,<10.0.0)",
    "pymdown-extensions (>=13.1.2,<14.0.0)",
    "openai (>=3.58.0,<4.0.0)",
]

[tool.uv]
required-version = ">=0.13.7"
default-groups = ["cpu", "dev"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cuda-arm64", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cuda-arm64", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cuda-arm64", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
triton = [
    { index = "pytorch-cuda-arm64", group = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# PyTorch publishes its ARM64 CUDA builds only for CUDA 12.9
[[tool.uv.index]]
name = "pytorch-cuda-arm64"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["uv_build (>=0.13.7,<0.14)"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.black]
skip-string-normalization = true
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "C901",  # too complex
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = []
